[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision2grasp"
version = "0.1.0"
description = "Gongshu Vision2Grasp robot vision and grasp research pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp==3.14.3",
    "aiortc==1.15.0",
    "av>=14,<18",
    "cryptography==50.0.1",
    "mujoco==3.9.0",
    "numpy>=1.26,<2",
    "opencv-python>=4.11,<5",
    "qrcode[pil]==8.2",
    "robosuite==1.5.2",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "ultralytics==8.4.128",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
