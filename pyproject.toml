[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision2grasp"
version = "0.1.0"
description = "Gongshu Robotics: an RGB-D perception-to-grasp simulation demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py>=3.16,<4",
    "mujoco==3.9.0",
    "numpy>=1.26,<2",
    "opencv-python>=4.11,<5",
    "robosuite==1.5.2",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "ultralytics==8.4.128",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
