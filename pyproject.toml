[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision2grasp"
version = "0.1.0"
description = "XUANSHU LAB: an extensible Windows AI and robotics research desktop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp==3.14.3",
    "aiortc==1.15.0",
    "av>=14,<18",
    "cryptography==50.0.1",
    "mujoco==3.9.0",
    "numpy>=1.26,<2",
    "opencv-python>=4.11,<5",
    "PySide6==6.8.3",
    "qrcode[pil]==8.2",
    "robosuite==1.5.2",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "ultralytics==8.4.128",
]

[project.scripts]
xuanshu-lab = "xuanshu_lab.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
