[project]
brand = "Gongshu Robotics"
seed = 7

[simulation]
environment = "Lift"
robot = "Panda"
controller = "OSC_POSE"
mujoco_version = "3.9.0"
robosuite_version = "1.5.2"

[camera]
name = "agentview"
width = 640
height = 480
provides_rgb = true
provides_depth = true

[perception]
backend = "ultralytics"
weights = "artifacts/models/yolo11n-seg.pt"
weights_sha256 = "55ed65c56c91713d23e8402371c6c49a6fd84f257f7dce452e8d70e41dcbe152"
confidence_threshold = 0.50
mask_threshold = 0.50
image_size = 640
device = "cpu"
target_classes = ["bottle", "cup"]
training_enabled = false

[geometry]
minimum_valid_depth_ratio = 0.50
minimum_points = 30
maximum_points = 4096
outlier_mad_scale = 3.5
minimum_depth_band_m = 0.01

[grasp]
strategy = "top_grasp_pca"
use_simulation_truth = false
minimum_points = 30
pca_inlier_quantile = 0.98
extent_lower_quantile = 0.02
extent_upper_quantile = 0.98
circularity_ratio_threshold = 0.85
minimum_planar_variance_m2 = 1e-8
minimum_gripper_width_m = 0.01
maximum_gripper_width_m = 0.08
width_clearance_m = 0.008
point_support_reference = 1000
upright_axisymmetric_class_names = ["bottle", "cup"]
upright_height_to_width_ratio = 1.5
upright_grasp_height_quantile = 0.75

[control]
backend = "panda_osc_pose"
use_simulation_truth = false
minimum_gripper_width_m = 0.01
maximum_gripper_width_m = 0.08
workspace_min_m = [-0.45, -0.45, 0.82]
workspace_max_m = [0.45, 0.45, 1.20]
minimum_downward_alignment = 0.90
pregrasp_offset_m = 0.10
lift_offset_m = 0.12
position_tolerance_m = 0.008
orientation_tolerance_rad = 0.08
maximum_translation_step_m = 0.02
maximum_rotation_step_rad = 0.15
osc_translation_scale_m = 0.05
osc_rotation_scale_rad = 0.50
home_open_steps = 6
pregrasp_max_steps = 80
descend_max_steps = 80
close_steps = 12
lift_max_steps = 80
return_home_max_steps = 100

[pipeline]
scene = "BottleLift"
camera_name = "frontview"
target_class_priority = ["bottle", "cup"]
evaluation_object_name = "bottle"
minimum_vertical_displacement_m = 0.03

[real_scene]
architecture = "real_world_first_simulation_validated"
target_class = "bottle"
default_camera_source = 0
frame_width = 640
frame_height = 480
processing_fps = 2.0
calibration_method = "manual_four_point_ruler"
candidate_count = 3
metric_depth_available = false

[spatial_perception]
backend = "depth_anything_v2_metric_indoor_small"
device = "cpu"
input_size = 518
model_revision = "3bc65d4e14a6786a61acec16453c50e12bf5f338"
upstream_code_revision = "a561b849ebae10a6f5ef49e26c83cbbcd36c71bf"
intrinsics_priority = ["calibrated", "sensor_metadata", "model_predicted", "nominal_fov"]
nominal_diagonal_fov_deg = 75.0
minimum_valid_depth_ratio = 0.50
minimum_points = 30
maximum_points = 4096
outlier_mad_scale = 3.5
minimum_depth_band = 0.02
heartbeat_interval_s = 0.5
download_warning_stall_s = 30.0
download_timeout_stall_s = 120.0
checksum_warning_s = 15.0
checksum_timeout_s = 60.0
model_loading_warning_s = 15.0
model_loading_timeout_s = 60.0
depth_inference_warning_s = 15.0
depth_inference_timeout_s = 60.0
point_cloud_warning_s = 5.0
point_cloud_timeout_s = 30.0
spatial_computing_warning_s = 5.0
spatial_computing_timeout_s = 30.0

[gongshu_grasp_planning]
strategy = "geometric_pca_top_down"
minimum_points = 30
extent_lower_quantile = 0.02
extent_upper_quantile = 0.98
minimum_gripper_width_m = 0.01
maximum_gripper_width_m = 0.08
width_clearance_m = 0.008
maximum_object_extent_m = 0.35
point_support_reference = 1000

[gongshu_validation]
scene_transform = "NORMALIZED_VALIDATION_SCENE"
controller = "MUJOCO_POSITION_DLS_IK"
camera_mode = "CINEMATIC"
render_width = 960
render_height = 540
render_fps = 24
lift_height_m = 0.08
stable_window_s = 0.45
